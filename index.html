<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Portfolio — Editorial, Book & Web</title>
  <!-- 웹폰트: Pretendard & Playfair Display -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #faf9f6;       /* 따뜻한 종이 질감의 미색 배경 */
      --card-bg: #ffffff;
      --text-main: #181818;
      --text-muted: #666666;
      --accent: #d9a01b;         /* 따뜻한 웜 옐로우 포인트 */
      --border-color: #e5e2dc;
      --max-width: 1200px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 상단 내비게이션 */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 249, 246, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo span {
      color: var(--accent);
    }

    nav ul {
      display: flex;
      gap: 2rem;
      list-style: none;
      font-size: 0.95rem;
      font-weight: 500;
    }

    nav a:hover {
      color: var(--accent);
    }

    /* 히어로 섹션 */
    .hero {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 6rem 2rem 4rem;
      border-bottom: 1px solid var(--border-color);
    }

    .hero-tag {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .hero h1 {
      font-size: clamp(2.1rem, 4.5vw, 3.6rem);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
      max-width: 820px;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
    }

    /* 포트폴리오 필터 & 그리드 */
    .work-section {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2.5rem;
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .project-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.06);
    }

    .project-card.hidden {
      display: none;
    }

    .thumb-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #ece9e1;
      overflow: hidden;
      position: relative;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .project-card:hover .thumb-wrap img {
      transform: scale(1.04);
    }

    .card-body {
      padding: 1.5rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card-year {
      color: var(--text-muted);
      font-weight: 400;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .card-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 소개 및 연락처 섹션 */
    .about-contact {
      background: #f2efe9;
      border-top: 1px solid var(--border-color);
      padding: 5rem 2rem;
    }

    .about-container {
      max-width: var(--max-width);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 4rem;
    }

    .about-box h2,
    .contact-box h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 1.2rem;
    }

    .about-box p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .skill-tags span {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.85rem;
      border-radius: 4px;
      font-size: 0.85rem;
